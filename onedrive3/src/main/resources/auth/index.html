<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authentication</title>
<style>
/* ═══════════════════════════════════════════════════════════
   Auth Tab — Styles
   Shared across all Microsoft extensions (Outlook, SharePoint, etc.)
   ═══════════════════════════════════════════════════════════ */

/* ── Theme Variables ── */
:root{
  --bg:#ffffff;--bg-card:#f8f9fb;--bg-card-hover:#eef1f5;--bg-card-active:#e8f0fe;
  --border:#d8dde5;--border-active:#1a73e8;
  /* Light mode text — all values pass WCAG AA (4.5:1+) on white/card backgrounds */
  --text:#1a1d23;          /* 16.9:1 — headings, labels, primary content */
  --text-secondary:#42484f;/* 10.1:1 — secondary labels, descriptions */
  --text-muted:#636b72;    /*  5.4:1 — hints, placeholders, helper text (was #9aa0a6 = 2.6:1 ✗) */
  --accent:#1a73e8;--accent-dark:#1557b0;--accent-light:#e8f0fe;
  --green:#34a853;--green-bg:rgba(52,168,83,.08);--green-border:rgba(52,168,83,.25);
  --red:#ea4335;--red-bg:rgba(234,67,53,.06);
  --r:16px;--rs:12px;
  --shadow:0 2px 12px rgba(0,0,0,.07);--shadow-hover:0 12px 32px rgba(0,0,0,.13);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--glass:14px;
}
[data-theme="dark"]{
  --bg:#07111f;--bg-card:rgba(18,26,39,.58);--bg-card-hover:rgba(30,42,60,.7);--bg-card-active:rgba(30,58,95,.6);
  --border:rgba(255,255,255,.08);--border-active:#5ea2ff;--text:#eef2ff;--text-secondary:#8ea0bd;
  --text-muted:#5a6a80;--accent:#5ea2ff;--accent-dark:#2b8ae6;--accent-light:rgba(94,162,255,.12);
  --green:#36d399;--green-bg:rgba(54,211,153,.1);--green-border:rgba(54,211,153,.25);
  --red:#ff6b81;--red-bg:rgba(255,107,129,.1);
  --shadow:0 4px 16px rgba(0,0,0,.3);--shadow-hover:0 15px 45px rgba(0,0,0,.4);
}

/* ── Base ── */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--text);min-height:100vh;transition:background .4s,color .3s;background:var(--bg)}
[data-theme="dark"] body{background:radial-gradient(circle at top left,rgba(94,162,255,.15),transparent 30%),radial-gradient(circle at bottom right,rgba(155,123,255,.12),transparent 30%),var(--bg)}
[data-theme="dark"] body::before{content:'';position:fixed;width:400px;height:400px;background:rgba(94,162,255,.1);filter:blur(120px);top:-100px;right:-100px;z-index:0;pointer-events:none}
[data-theme="dark"] body::after{content:'';position:fixed;width:300px;height:300px;background:rgba(155,123,255,.08);filter:blur(120px);bottom:-80px;left:-80px;z-index:0;pointer-events:none}
:root body{background-image:radial-gradient(ellipse at 0% 0%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 50%),radial-gradient(ellipse at 100% 100%,color-mix(in srgb,var(--accent) 3%,transparent),transparent 50%);background-attachment:fixed}

/* ── Layout: full-width, scrollable ── */
html,body{min-height:100%}
.shell{position:relative;z-index:1;width:100%;min-height:100%;display:flex;flex-direction:column;padding:20px 24px}
.loading{text-align:center;padding:60px;color:var(--text-muted);font-size:14px}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes infoSlide{from{opacity:0;max-height:0;padding:0 16px;margin-bottom:0}to{opacity:1;max-height:100px;padding:14px 16px;margin-bottom:16px}}

/* ── Header ── */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;animation:fadeUp .5s ease both;flex-wrap:wrap;gap:10px;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#0078d4,#5ea2ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 20px rgba(0,120,212,.25)}
.header-logo svg{width:24px;height:24px}
.header-info h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
/* Light mode h1 — subtle accent gradient instead of flat black */
:root .header-info h1{background:linear-gradient(110deg,#1a1d23 25%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-theme="dark"] .header-info h1{background:linear-gradient(90deg,#fff,#8db8ff,#b28cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header-info p{font-size:12.5px;color:var(--text-secondary)}
.header-actions{display:flex;gap:8px;align-items:center}

/* ── Buttons ── */
.btn{padding:9px 20px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .25s;position:relative;overflow:hidden;font-family:var(--font)}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.12);opacity:0;transition:opacity .2s}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.97)}
.btn-test{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 3px 12px rgba(26,115,232,.3)}
.btn-test:hover{box-shadow:0 5px 18px rgba(26,115,232,.4);transform:translateY(-1px)}
.btn-test:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn-test:disabled::after{display:none}
.btn-save{background:var(--bg-card);color:var(--accent);border:1.5px solid var(--border)}
.btn-save:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.btn-save:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-save:disabled::after{display:none}
.btn-theme{background:none;border:1.5px solid var(--border);border-radius:var(--rs);padding:7px 11px;cursor:pointer;font-size:15px;color:var(--text-secondary);transition:.3s}
.btn-theme:hover{transform:rotate(20deg);border-color:var(--accent)}

/* ── Sidebar + Content Layout ── */
.main{display:grid;grid-template-columns:170px 1fr;gap:20px;animation:fadeUp .5s ease both;animation-delay:.08s;flex:1;min-height:0}
.sidebar{display:flex;flex-direction:column;gap:10px;align-self:start}
.side-card{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:18px 12px;border:2px solid var(--border);border-radius:var(--r);
  cursor:pointer;background:var(--bg-card);text-align:center;position:relative;
  transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow);
}
[data-theme="dark"] .side-card{backdrop-filter:blur(var(--glass))}
.side-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--border-active) 35%,var(--border))}
.side-card.active{border-color:var(--border-active);background:var(--bg-card-active);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent),var(--shadow-hover);transform:translateY(-1px)}
[data-theme="dark"] .side-card.active{box-shadow:0 0 0 3px rgba(94,162,255,.18),0 12px 36px rgba(94,162,255,.15)}
.side-icon{width:32px;height:32px;color:var(--text-secondary);transition:transform .3s}
.side-card:hover .side-icon{transform:scale(1.12)}
.side-card.active .side-icon{color:var(--accent);transform:scale(1.08)}
.side-title{font-size:13px;font-weight:700;transition:color .2s}
.side-card.active .side-title{color:var(--accent)}
.side-desc{font-size:10.5px;color:var(--text-secondary);line-height:1.35}
.badge-rec{font-size:9px;font-weight:700;color:var(--green);background:var(--green-bg);border:1px solid var(--green-border);border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.4px}

/* ── Content panel ── */
.content{overflow-y:auto;overflow-x:hidden;min-height:0;padding-right:4px}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.content-inner{animation:fadeUp .35s ease both}

/* ── Section headers ── */
.sec-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.sec-title svg{width:14px;height:14px;color:var(--accent)}

/* ── Sub toggle (User Sign-In / App-Only) ── */
.sub-toggle{display:flex;gap:0;margin-bottom:14px;border:2px solid var(--border);border-radius:var(--rs);overflow:hidden}
.sub-toggle-btn{flex:1;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:var(--bg-card);color:var(--text-secondary);font-family:var(--font);transition:all .25s;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
.sub-toggle-btn:first-child{border-right:1px solid var(--border)}
.sub-toggle-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
.sub-toggle-btn:hover:not(.active){background:var(--bg-card-hover)}
.sub-toggle-btn svg{width:16px;height:16px;flex-shrink:0}

/* ── Sub-mode info card ── */
.sub-desc{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:16px;animation:infoSlide .4s cubic-bezier(.16,1,.3,1) both;overflow:hidden}
.sub-desc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sub-desc-icon.signin{background:var(--accent-light);color:var(--accent)}
.sub-desc-icon.apponly{background:rgba(155,123,255,.12);color:#9b7bff}
[data-theme="dark"] .sub-desc-icon.signin{background:rgba(94,162,255,.15)}
[data-theme="dark"] .sub-desc-icon.apponly{background:rgba(155,123,255,.15)}
.sub-desc-icon svg{width:20px;height:20px}
.sub-desc-text{flex:1}
.sub-desc-text strong{font-size:13px;font-weight:700;color:var(--text);display:block;margin-bottom:2px}
.sub-desc-text span{font-size:11.5px;color:var(--text-secondary);line-height:1.4}

/* ── Form ── */
.form-section{display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.form-group label .req{color:var(--red);margin-left:2px}
.field-hint{font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;line-height:1.4}
.sidebar-guide-link{display:flex;align-items:center;gap:7px;margin-top:8px;padding:10px 14px;border-radius:var(--rs);font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;border:1px solid var(--border);background:var(--bg-card);transition:background .15s,border-color .15s}
.sidebar-guide-link:hover{background:var(--accent-light);border-color:var(--accent)}
.sidebar-guide-link svg{width:15px;height:15px;flex-shrink:0;opacity:.8}
.ms-doc-link{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;font-weight:500;color:var(--accent);text-decoration:none;transition:opacity .15s}
.ms-doc-link:hover{opacity:.75;text-decoration:underline}
.ms-doc-link svg{width:12px;height:12px;flex-shrink:0}
.form-group input[type="text"],
.form-group input[type="email"],
.form-group input[type="password"],
.form-group input[type="number"]{
  padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--rs);
  font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);
  outline:none;transition:border-color .25s,box-shadow .25s;width:100%;
}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.form-group input::placeholder{color:var(--text-muted)}
/* Light mode placeholder slightly lighter than --text-muted so it reads as placeholder */
:root .form-group input::placeholder{color:#8c949c}
[data-theme="dark"] .form-group input{background:rgba(255,255,255,.04)}

/* ── Custom settings (2-column grid) ── */
.custom-section{margin-top:8px}
.custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.custom-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;transition:box-shadow .2s;display:flex;flex-direction:column;justify-content:space-between}
.custom-item:hover{box-shadow:var(--shadow)}
.custom-item label{font-size:12.5px;font-weight:600;color:var(--text);display:block;margin-bottom:4px}
.custom-item .help{font-size:11px;color:var(--text-muted);margin-top:6px;padding-top:0}
.check-row{display:flex;align-items:center;gap:9px;margin:4px 0}
.check-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.check-row label{font-size:13px;font-weight:500;color:var(--text);cursor:pointer;margin-bottom:0}
.check-label{font-size:12.5px;font-weight:400;color:var(--text-muted)!important;margin-bottom:0!important}
.num-input{width:70px;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:var(--font);background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.num-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
[data-theme="dark"] .num-input{background:rgba(255,255,255,.04)}
.num-row{display:flex;align-items:center;gap:8px}
.num-row .unit{font-size:12px;color:var(--text-muted)}

/* ── Scopes ── */
.scope-section{margin-top:8px}
.scope-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:6px 0}
.scope-header:hover .scope-title{color:var(--accent)}
.scope-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary)}
.scope-arrow{color:var(--text-muted);font-size:12px;transition:transform .3s}
.scope-arrow.open{transform:rotate(180deg)}
.scope-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.scope-chip{font-size:11px;padding:5px 12px;border-radius:999px;font-weight:600;border:1.5px solid;transition:all .25s}
.scope-chip.on,.scope-chip.static{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.scope-chip.on{cursor:pointer}
.scope-chip.static{cursor:default}
.scope-chip.off{background:var(--bg-card);color:var(--text-muted);border-color:var(--border);cursor:pointer}
/* OFF chip hover — clearly signal "click to add" with strong blue background */
.scope-chip.off:hover{
  background:color-mix(in srgb,var(--accent) 14%,var(--bg-card));
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-2px);
  box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 22%,transparent);
}
/* ON chip hover — signal "click to remove" with slight dim + shadow */
.scope-chip.on:hover{
  opacity:.75;
  transform:translateY(-2px);
  box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 22%,transparent);
}
.scope-chip:active:not(.static){transform:scale(.95)}
.scope-body{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s}
.scope-body.open{max-height:900px;opacity:1}

/* ── Catalog table ── */
.catalog-cols{display:flex;gap:12px;margin-top:14px}
.catalog-col{flex:1;border:1.5px solid var(--border);border-radius:var(--rs);overflow:hidden;transition:box-shadow .2s}
.catalog-col:hover{box-shadow:var(--shadow)}
.catalog-col-header{padding:7px 11px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.catalog-col-header.supported{background:var(--green-bg);color:var(--green);border-bottom:1px solid var(--green-border)}
.catalog-col-header.unsupported{background:var(--red-bg);color:var(--red);border-bottom:1px solid rgba(234,67,53,.2)}
.catalog-col-body{padding:6px 10px;max-height:180px;overflow-y:auto}
.catalog-item{font-size:11.5px;padding:4px 7px;border-radius:5px;margin:1px 0;color:var(--text);transition:background .15s}
.catalog-item:hover{background:var(--bg-card-hover)}
.catalog-item.unsup{display:flex;justify-content:space-between;align-items:center}
.catalog-item .scope-tag{font-size:9px;background:var(--red-bg);color:var(--red);border:1px solid rgba(234,67,53,.2);border-radius:999px;padding:1px 6px;font-weight:600}
.catalog-empty{font-size:11px;color:var(--text-muted);font-style:italic;padding:4px 0}

/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);padding:12px 24px;border-radius:var(--rs);font-size:13px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.2);opacity:0;pointer-events:none;z-index:100;transition:all .35s cubic-bezier(.4,0,.2,1);font-family:var(--font);backdrop-filter:blur(12px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast.success{background:var(--green);color:#fff}
.toast.error{background:var(--red);color:#fff}
.hidden{display:none!important}

/* ── Responsive ── */
@media(max-width:700px){
  .shell{padding:14px 12px}
  .main{grid-template-columns:1fr;flex:1;min-height:0}
  .sidebar{flex-direction:row;gap:8px;flex-shrink:0}
  .side-card{flex:1;padding:10px 6px}
  .side-desc{display:none}
  .custom-grid{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div class="auth-page" id="app">
  <div class="loading">Loading authentication configuration...</div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ═══════════════════════════════════════════════════════════
   Auth Tab — Application Logic
   Shared across all Microsoft extensions (Outlook, SharePoint, etc.)
   Handles: mode switching, API calls, credential memory, scopes, OAuth popup
   ═══════════════════════════════════════════════════════════ */

(function(){
  // ── AuthFlow constants (match Java AuthFlow enum / Constants.java) ──
  var FLOW_PUBLIC='AUTH_CODE_PUBLIC';    // Quick Setup — Krista-managed OAuth
  var FLOW_PRIVATE='AUTH_CODE_PRIVATE'; // User Authentication — own OAuth app
  var FLOW_APPONLY='CLIENT_CREDENTIALS_SECRET'; // Server to Server Authentication — client credentials

  var config=null,isDark=localStorage.getItem('ms-auth-theme')==='dark';
  var activeMode='quick',subMode='signin',selectedScopes=[],scopePanelOpen=true;

  // Per-mode credential memory (keyed by UI mode name for clarity)
  var mem={
    quick:  {email:'',clientId:'',clientSecret:'',tenantId:''},
    signin: {email:'',clientId:'',clientSecret:'',tenantId:''},
    apponly: {email:'',clientId:'',clientSecret:'',tenantId:''}
  };
  var memCustom={quick:{},signin:{},apponly:{}};
  // Per-mode saved custom — prevents one flow's settings bleeding into another
  var savedCustom={quick:{},signin:{},apponly:{}};
  var isConnSuccess=false,loading=false,saving=false;

  function $(id){return document.getElementById(id)}
  function currentKey(){return activeMode==='quick'?'quick':subMode}
  // Map UI mode key to AuthFlow string sent to/received from backend
  function keyToFlow(key){
    if(key==='quick')return FLOW_PUBLIC;
    if(key==='signin')return FLOW_PRIVATE;
    return FLOW_APPONLY;
  }
  // Map AuthFlow to authType expected by SDK backend (MsAuthAttributes)
  // Public = delegated OAuth (both Krista's app and user's own app)
  // Private = client credentials only (Server to Server, no user sign-in)
  function flowToAuthType(flow){
    if(flow===FLOW_APPONLY)return 'Private';
    return 'Public';
  }

  /* ─────────────────────────────────────────────
     API Layer
     ───────────────────────────────────────────── */

  function detectExtensionId(){
    var m=location.pathname.match(/\/rest\/(\w+)\//);
    return m?m[1]:'outlook';
  }

  function fetchJson(url,method,body){
    var o={method:method,headers:{'Content-Type':'application/json'}};
    if(body)o.body=JSON.stringify(body);
    return fetch(url,o).then(function(r){
      var ct=r.headers.get('content-type')||'';
      if(ct.indexOf('json')>=0)return r.json();
      return r.text().then(function(t){
        try{return JSON.parse(t)}catch(e){return{isSuccess:false,errorMessage:t}}
      });
    });
  }

  var api={
    testConnection: function(p){return fetchJson('../testConnection','POST',p)},
    saveCredentials: function(p){return fetchJson('../saveCredentials','POST',p)},
    getCredentials: function(flow){return fetchJson('../getCredentials?authType='+encodeURIComponent(flowToAuthType(flow))+'&authFlow='+encodeURIComponent(flow),'GET')},
    getMetadata:    function(id){return fetchJson('../msauth/metadata/'+id,'GET')}
  };

  /* ─────────────────────────────────────────────
     Theme
     ───────────────────────────────────────────── */

  function applyTheme(){document.documentElement.setAttribute('data-theme',isDark?'dark':'light')}
  applyTheme();

  /* ─────────────────────────────────────────────
     Init
     ───────────────────────────────────────────── */

  function init(){
    var eid=detectExtensionId();
    api.getMetadata(eid).then(function(c){
      config=c;
      if(!config||!config.id)return fetchJson('../../msauth/metadata/'+eid,'GET');
      return config;
    }).then(function(c){
      if(c&&c!==config)config=c;
      if(!config||!config.id){$('app').innerHTML='<div class="loading">Extension not found.</div>';return}
      selectedScopes=(config.defaultScopes||[]).slice();
      renderPage();
      // Probe flows in priority order: User Auth → Machine Auth → Quick Setup (default)
      loadCredentials(FLOW_PRIVATE,function(privCreds){
        if(privCreds&&privCreds.email){
          // User Authentication is active
          activeMode='advanced';subMode='signin';
          $('side-quick').className='side-card';
          $('side-advanced').className='side-card active';
          var gl=$('sideGuideLink');if(gl)gl.style.display='flex';
          renderContent();
        } else {
          loadCredentials(FLOW_APPONLY,function(appCreds){
            if(appCreds&&appCreds.email){
              // Server to Server Authentication is active
              activeMode='advanced';subMode='apponly';
              $('side-quick').className='side-card';
              $('side-advanced').className='side-card active';
              var gl=$('sideGuideLink');if(gl)gl.style.display='flex';
              renderContent();
            } else {
              // Quick Setup is active (or no credentials saved yet) — stay on default
              loadCredentials(FLOW_PUBLIC);
            }
          });
        }
      });
    }).catch(function(){
      $('app').innerHTML='<div class="loading">Failed to load config.</div>';
    });
  }

  /* ─────────────────────────────────────────────
     Load Credentials from Backend
     ───────────────────────────────────────────── */

  // flow: one of FLOW_PUBLIC, FLOW_PRIVATE, FLOW_APPONLY
  function loadCredentials(flow,callback){
    api.getCredentials(flow).then(function(creds){
      if(callback)callback(creds);
      if(!creds||!creds.email)return;

      if(flow===FLOW_PUBLIC){
        // Quick Setup — only email is returned (Krista-managed credentials hidden)
        mem.quick.email=creds.email||'';
        (config.customSections||[]).forEach(function(s){s.fields.forEach(function(f){
          if(creds[f.key]!==undefined){savedCustom.quick[f.key]=creds[f.key];memCustom.quick[f.key]=creds[f.key]}
        })});
        if(activeMode==='quick')populateFields();
        return;
      }

      if(creds.selectedScopes&&creds.selectedScopes.length)selectedScopes=creds.selectedScopes;
      var m={email:creds.email||'',clientId:creds.clientId||'',clientSecret:creds.clientSecret||'',tenantId:creds.tenantId||''};

      if(flow===FLOW_PRIVATE){
        mem.signin=m;
        (config.customSections||[]).forEach(function(s){s.fields.forEach(function(f){
          if(creds[f.key]!==undefined){savedCustom.signin[f.key]=creds[f.key];memCustom.signin[f.key]=creds[f.key]}
        })});
      } else { // FLOW_APPONLY
        mem.apponly=m;
        (config.customSections||[]).forEach(function(s){s.fields.forEach(function(f){
          if(creds[f.key]!==undefined){savedCustom.apponly[f.key]=creds[f.key];memCustom.apponly[f.key]=creds[f.key]}
        })});
      }
      populateFields();updateScopes();
    }).catch(function(){if(callback)callback(null)});
  }

  /* ─────────────────────────────────────────────
     Collect Payload for API
     ───────────────────────────────────────────── */

  function collectPayload(){
    var v=function(id){var e=$(id);return e?e.value.trim():''};
    var p={};
    if(activeMode==='quick'){
      p.authType=flowToAuthType(FLOW_PUBLIC);p.authFlow=FLOW_PUBLIC;
      p.email=v('f-email');p.allowMailAlert=false;
    } else if(subMode==='signin'){
      p.authType=flowToAuthType(FLOW_PRIVATE);p.authFlow=FLOW_PRIVATE;p.publicAuthMode='own';
      p.email=v('f-email');p.clientId=v('f-clientId');p.clientSecret=v('f-clientSecret');
      if(v('f-tenantId'))p.tenantId=v('f-tenantId');
      p.allowMailAlert=false;
    } else {
      p.authType=flowToAuthType(FLOW_APPONLY);p.authFlow=FLOW_APPONLY;
      p.email=v('f-email');p.clientId=v('f-clientId');p.clientSecret=v('f-clientSecret');p.tenantId=v('f-tenantId');
      p.allowMailAlert=false;
    }
    p.scopes=selectedScopes;
    (config.customSections||[]).forEach(function(s){s.fields.forEach(function(f){
      var el=$('cf-'+f.key);
      if(el){p[f.key]=f.type==='BOOLEAN'?el.checked:f.type==='NUMBER'?Number(el.value):el.value}
    })});
    return p;
  }

  function fieldsValid(){
    var v=function(id){var e=$(id);return e&&e.value.trim()};
    if(!v('f-email'))return false;
    if(activeMode==='quick')return true;
    return v('f-clientId')&&v('f-clientSecret')&&v('f-tenantId');
  }

  /* ─────────────────────────────────────────────
     Field Memory (save/restore per mode)
     ───────────────────────────────────────────── */

  function saveFieldsToMem(){
    var k=currentKey();
    var e=$('f-email'),c=$('f-clientId'),s=$('f-clientSecret'),t=$('f-tenantId');
    mem[k]={email:e?e.value:'',clientId:c?c.value:'',clientSecret:s?s.value:'',tenantId:t?t.value:''};
    (config.customSections||[]).forEach(function(sec){sec.fields.forEach(function(f){
      var el=$('cf-'+f.key);
      if(el)memCustom[k][f.key]=f.type==='BOOLEAN'?el.checked:el.value;
    })});
  }

  function populateFields(){
    var k=currentKey(),m=mem[k];
    var e=$('f-email'),c=$('f-clientId'),s=$('f-clientSecret'),t=$('f-tenantId');
    if(e)e.value=m.email;if(c)c.value=m.clientId;if(s)s.value=m.clientSecret;if(t)t.value=m.tenantId;
    (config.customSections||[]).forEach(function(sec){sec.fields.forEach(function(f){
      var el=$('cf-'+f.key);
      if(el){
        var cv=memCustom[k][f.key];
        if(cv===undefined)cv=savedCustom[k][f.key];
        if(f.type==='BOOLEAN')el.checked=!!cv;
        else el.value=cv!==undefined?cv:(f.defaultValue||'');
      }
    })});
    updateButtons();
  }

  /* ─────────────────────────────────────────────
     Mode Switching
     ───────────────────────────────────────────── */

  function clearMem(key){
    mem[key]={email:'',clientId:'',clientSecret:'',tenantId:''};
    memCustom[key]={};
    savedCustom[key]={};
  }

  function setMode(mode){
    if(mode===activeMode)return;
    saveFieldsToMem();activeMode=mode;isConnSuccess=false;
    // Clear target mode memory — backend will repopulate if credentials exist
    if(mode==='quick'){
      clearMem('quick');
      loadCredentials(FLOW_PUBLIC);
    } else {
      subMode='signin'; // Always default to User Authentication when entering Advanced Setup
      clearMem('signin');clearMem('apponly');
      loadCredentials(FLOW_PRIVATE);
    }
    renderContent();populateFields();updateScopes();updateButtons();
    $('side-quick').className='side-card'+(mode==='quick'?' active':'');
    $('side-advanced').className='side-card'+(mode==='advanced'?' active':'');
    var gl=$('sideGuideLink');if(gl)gl.style.display=mode==='advanced'?'flex':'none';
  }

  function setSubMode(mode){
    if(mode===subMode)return;
    saveFieldsToMem();subMode=mode;isConnSuccess=false;
    // Clear target mode memory so fields start empty; backend populates if saved
    clearMem(mode);
    renderContent();populateFields();updateScopes();updateButtons();
    loadCredentials(mode==='signin'?FLOW_PRIVATE:FLOW_APPONLY);
  }

  /* ─────────────────────────────────────────────
     Scopes
     ───────────────────────────────────────────── */

  function toggleScope(){
    scopePanelOpen=!scopePanelOpen;
    var b=$('scopeBody'),a=$('scopeArrow');
    if(b)b.className=scopePanelOpen?'scope-body open':'scope-body';
    if(a)a.className=scopePanelOpen?'scope-arrow open':'scope-arrow';
  }

  function toggleScopeItem(s){
    var i=selectedScopes.indexOf(s);
    if(i>=0)selectedScopes.splice(i,1);else selectedScopes.push(s);
    isConnSuccess=false;updateScopes();updateButtons();
  }

  function updateScopes(){
    if(!config)return;
    var all=(config.scopes||[]).map(function(s){return s.value});
    var isQ=activeMode==='quick',isApp=activeMode==='advanced'&&subMode==='apponly';
    var sec=$('scopeSection');if(!sec)return;
    if(isApp){sec.style.display='none';return}
    sec.style.display='';

    var lbl=$('scopeLabel'),chips=$('scopeChips');
    if(isQ){
      if(lbl)lbl.textContent='All permissions enabled with Krista Managed credentials.';
      if(chips)chips.innerHTML=all.map(function(s){return'<span class="scope-chip static">'+esc(s)+'</span>'}).join('');
    } else {
      if(lbl)lbl.textContent=selectedScopes.length+' of '+all.length+' selected';
      if(chips)chips.innerHTML=all.map(function(s){
        var on=selectedScopes.indexOf(s)>=0;
        return'<span class="scope-chip '+(on?'on':'off')+'" onclick="window._a.toggleScopeItem(\''+s+'\')">'+esc(s)+'</span>';
      }).join('');
    }

    // Catalog table
    var scm={};
    (config.scopes||[]).forEach(function(s){if(s.catalogRequests&&s.catalogRequests.length)scm[s.value]=s.catalogRequests});
    var act=isQ?all:selectedScopes,sup=[],unsup=[];
    Object.keys(scm).forEach(function(sc){scm[sc].forEach(function(r){if(act.indexOf(sc)>=0)sup.push(r);else unsup.push({n:r,s:sc})})});
    var ct=$('catalogTable');if(!ct||!Object.keys(scm).length){if(ct)ct.innerHTML='';return}
    ct.innerHTML='<div class="catalog-cols"><div class="catalog-col"><div class="catalog-col-header supported">&#10003; Supported ('+sup.length+')</div><div class="catalog-col-body">'+(sup.length?sup.map(function(r){return'<div class="catalog-item">'+esc(r)+'</div>'}).join(''):'<div class="catalog-empty">None</div>')+'</div></div><div class="catalog-col"><div class="catalog-col-header unsupported">&#10007; Not Supported ('+unsup.length+')</div><div class="catalog-col-body">'+(unsup.length?unsup.map(function(r){return'<div class="catalog-item unsup"><span>'+esc(r.n)+'</span><span class="scope-tag">'+esc(r.s)+'</span></div>'}).join(''):'<div class="catalog-empty"><em>All available</em></div>')+'</div></div></div>';
  }

  /* ─────────────────────────────────────────────
     Test Connection + OAuth Popup
     ───────────────────────────────────────────── */

  function doTest(){
    if(loading)return;
    var em=$('f-email'),email=em?em.value.trim():'';
    if(!email||email.indexOf('@')<0){
      if(em){em.style.boxShadow='0 0 0 2px var(--red)';setTimeout(function(){em.style.boxShadow=''},2000)}
      showToast('Please enter a valid email','error');return;
    }
    if(activeMode!=='quick'&&!fieldsValid()){showToast('Fill all required fields','error');return}

    var p=collectPayload();loading=true;updateButtons();
    api.testConnection(p).then(function(r){
      if(r.isSuccess){
        isConnSuccess=true;
        showToast('Connected! Click Save to apply.','success');
      } else if(r.url){
        handlePopup(r.url,p);
      } else {
        showToast(r.errorMessage||'Test failed','error');
      }
      loading=false;updateButtons();
    }).catch(function(e){showToast('Test failed: '+e.message,'error');loading=false;updateButtons()});
  }

  function handlePopup(url,p){
    var w=window.open(url,'_blank','width=600,height=700');
    if(!w){showToast('Popup blocked','error');loading=false;updateButtons();return}
    var iv=setInterval(function(){
      if(w.closed){
        clearInterval(iv);loading=true;updateButtons();
        api.testConnection(p).then(function(r){
          if(r.isSuccess){isConnSuccess=true;showToast('Connected! Click Save to apply.','success')}
          else{showToast(r.errorMessage||'Authentication failed. Please check your credentials and try again.','error')}
          loading=false;updateButtons();
        }).catch(function(){showToast('Auth check failed','error');loading=false;updateButtons()});
      }
    },1000);
  }

  /* ─────────────────────────────────────────────
     Save Credentials
     ───────────────────────────────────────────── */

  function doSave(){
    if(saving)return;
    var p=collectPayload();saving=true;updateButtons();
    api.saveCredentials(p).then(function(r){
      if(r.isSuccess){
        showToast('Saved!','success');isConnSuccess=false;
        // Only one auth type can be active — clear the others so they show empty
        if(activeMode==='quick'){
          clearMem('signin');clearMem('apponly');
          savedCustom.signin={};savedCustom.apponly={};
        } else if(subMode==='signin'){
          clearMem('quick');clearMem('apponly');
          savedCustom.quick={};savedCustom.apponly={};
        } else {
          clearMem('quick');clearMem('signin');
          savedCustom.quick={};savedCustom.signin={};
        }
      } else {
        showToast(r.errorMessage||'Save failed','error');
      }
      saving=false;updateButtons();
    }).catch(function(e){showToast('Save failed: '+e.message,'error');saving=false;updateButtons()});
  }

  /* ─────────────────────────────────────────────
     Button State
     ───────────────────────────────────────────── */

  function updateButtons(){
    var tb=$('btnTest'),sb=$('btnSave');
    var sp=loading?'<span style="display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .5s linear infinite;margin-right:6px"></span>':'';
    var ss=saving?'<span style="display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .5s linear infinite;margin-right:6px"></span>':'';
    if(tb){var ok=activeMode==='quick'?!!($('f-email')&&$('f-email').value.trim()):fieldsValid();tb.disabled=!ok||loading;tb.innerHTML=sp+'Test Connection'}
    if(sb){sb.disabled=!isConnSuccess||saving;sb.innerHTML=ss+'Save Changes'}
  }

  function onFieldInput(){isConnSuccess=false;updateButtons()}

  /* ─────────────────────────────────────────────
     Toast Notifications
     ───────────────────────────────────────────── */

  function showToast(msg,type){
    var t=$('toast');t.textContent=msg;t.className='toast '+type+' show';
    setTimeout(function(){t.className='toast'},3500);
  }



  /* ─────────────────────────────────────────────
     Theme Toggle
     ───────────────────────────────────────────── */

  function toggleTheme(){
    isDark=!isDark;
    localStorage.setItem('ms-auth-theme',isDark?'dark':'light');
    applyTheme();
    var b=$('btnTheme');if(b)b.textContent=isDark?'\u2600':'\uD83C\uDF19';
  }

     Render: Right Panel Content

      // Info card
      if(subMode==='signin'){
        h+='<div class="sub-desc"><div class="sub-desc-icon signin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/><path d="M20 10h-2V8c0-.55-.45-1-1-1s-1 .45-1 1v2h-2c-.55 0-1 .45-1 1s.45 1 1 1h2v2c0 .55.45 1 1 1s1-.45 1-1v-2h2c.55 0 1-.45 1-1s-.45-1-1-1z" opacity=".6"/></svg></div><div class="sub-desc-text"><strong>User Authentication (OAuth 2.0)</strong><span>Users authenticate via Microsoft popup. Each user signs in with their own account. Best for individual mailbox access with delegated permissions.</span><a class="ms-doc-link" href="https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg> Create an Azure AD app on Microsoft</a></div></div>';
      } else {
        h+='<div class="sub-desc"><div class="sub-desc-icon apponly"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h6v2H8v2h8v-2h-2v-2h6c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12H4V5h16v10z"/><path d="M9 8h6v1H9zm0 2.5h4v1H9z" opacity=".5"/></svg></div><div class="sub-desc-text"><strong>Server to Server Authentication (Client Credentials)</strong><span>Server-to-server authentication with no user sign-in required. The app acts on behalf of the organization using application permissions.</span><a class="ms-doc-link" href="https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-client-creds-grant-flow" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg> Create an Azure AD app on Microsoft</a></div></div>';

      h+='<div class="form-group"><label>Tenant ID <span class="req">*</span></label><span class="field-hint">Your Azure AD Directory (tenant) ID — identifies your Microsoft organization.</span><input type="text" id="f-tenantId" placeholder="Azure AD Directory (tenant) ID" oninput="window._a.onFieldInput()"></div>';

      h+='<div class="scope-body open" id="scopeBody">';

  /* ─────────────────────────────────────────────
     Render: Full Page (header + sidebar + content)
     ───────────────────────────────────────────── */

  function renderPage(){
    if(!config)return;
    var c=config;
    var title=c.headerTitle||'Authentication';
